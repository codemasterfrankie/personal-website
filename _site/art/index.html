	<script>
		document.querySelectorAll('.navlink').forEach(link => {
			link.addEventListener('click', function(e) {
				e.preventDefault();
				const href = this.href;
				
				// do nothing if clicking already active link
				if (this.classList.contains('active')) return;
				if (this.classList.contains('not-button')) return;


				// find currently active link, makes it recede
				const activeLink = document.querySelector('.navlink.active');
				if (activeLink) {
					activeLink.classList.add('receding');
				}

				
				setTimeout(() => {
					window.location.href = href;
				}, 200);
				})
			
		});
	</script>
